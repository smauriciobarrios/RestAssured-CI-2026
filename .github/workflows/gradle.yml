name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      suite:
        description: "Tag de cucumber a ejecutar"
        required: true
        default: "@projects"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4 # v4.0.0

    - name: Dar permisos al comando gradlew
      run: chmod +x ./gradlew

    - name: Ejecutar tests
      env:
        SUITE: ${{github.event.inputs.suite || '@projects'}}
      run: ./gradlew cucumber -Psuite="$SUITE"
